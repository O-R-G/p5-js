<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dots 2 — CSS</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #222;
    }

    .canvas {
      position: relative;
      width: 400px;
      height: 400px;
      overflow: hidden;
      background: transparent;
    }

    .dots {
      position: absolute;
      inset: 0;
      transform-origin: center;
      animation: rotate-dots 4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .dot {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
    }

    .dot-blue {
      top: 35px;
      left: 185px;
      background: #0000FF;
    }

    .dot-red {
      top: 185px;
      left: 35px;
      background: #FF0000;
    }

    @keyframes rotate-dots {
      from {
        transform: rotate(0deg);
      }
      50%,
      100% {
        transform: rotate(-1080deg);
      }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="dots">
      <div class="dot dot-blue"></div>
      <div class="dot dot-red"></div>
    </div>
  </div>
</body>
</html>
